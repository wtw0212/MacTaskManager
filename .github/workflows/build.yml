name: Build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (debug, warnings as errors)
        run: |
          set -o pipefail
          swift build -Xswiftc -warnings-as-errors 2>&1 | tee build.log
      - name: Summarize errors
        if: failure()
        run: grep -E "(error|warning):" build.log | sort -u || true
      - name: Build release app and DMG
        run: |
          chmod +x scripts/make-dmg.sh
          ./scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TaskManager-dmg
          path: dist/TaskManager.dmg
          retention-days: 7
